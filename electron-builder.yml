appId: com.lucasrafaldini.paperdeck
productName: PaperDeck

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - backend/**/*
  - render/**/*
  - kindle/**/*
  - scripts/**/*
  - locales/**/*
  - package.json

extraResources:
  - from: build/icon.png
    to: icon.png

asar: true

mac:
  target:
    - target: default
  icon: build/icon.png
  category: public.app-category.developer-tools
  darkModeSupport: true
  artifactName: PaperDeck-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
  artifactName: PaperDeck-${version}-${arch}.${ext}

win:
  target: nsis
  icon: build/icon.png
  artifactName: PaperDeck-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
