<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard Render</title>
<!--__INJECT__-->
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var captureScale = Number(params.get('captureScale') || '');
    if (params.get('device') === 'kt3' || params.get('res') === '800x600') {
      document.documentElement.className = 'kt3';
    } else if (captureScale > 0 && captureScale <= 1) {
      document.documentElement.className = 'capture-landscape';
      document.documentElement.style.setProperty('--capture-scale', String(captureScale));
    } else if (params.get('desktop') === '1') {
      document.documentElement.className = 'desktop';
    }
    if (params.get('pip') === '1') {
      document.documentElement.classList.add('pip');
    }
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --capture-scale: 1; }
  html, body { width: 1072px; height: 1448px; background: #fff; color: #000; overflow: hidden; }
  body { font-family: Helvetica, Arial, sans-serif; -webkit-font-smoothing: none; }

  /* Kindle 8th Gen (KT3) 800x600 landscape */
  html.kt3, html.kt3 body { width: 800px; height: 600px; }
  html.kt3 .stage {
    position: relative; top: auto; left: auto;
    transform: none;
    width: 800px; height: 600px;
    padding: 16px 20px;
  }
  html.kt3 header {
    border-bottom: 4px solid #000; padding-bottom: 6px; margin-bottom: 12px;
  }
  html.kt3 h1 { font-size: 26px; font-weight: 800; }
  html.kt3 .stamp { font-size: 15px; font-weight: bold; }
  html.kt3 .cols { display: flex; gap: 14px; flex: 1; }
  html.kt3 .cols.custom-layout { display: flex; flex-wrap: wrap; gap: 14px; }
  html.kt3 .col-stacked { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
  html.kt3 .col-stacked .card { padding: 10px 14px; flex: 1; display: flex; flex-direction: column; }
  html.kt3 .col-stacked .card h2 { font-size: 19px; margin-bottom: 6px; padding-bottom: 3px; }
  html.kt3 .col-stacked .row { margin: 5px 0; }
  html.kt3 .col-stacked .row .label { font-size: 14px; margin-bottom: 2px; }
  html.kt3 .col-stacked .bar { height: 16px; }
  html.kt3 .col-stacked .reset { font-size: 12px; margin-top: 2px; }
  html.kt3 .col-stacked .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
    gap: 4px;
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px solid #888;
  }
  html.kt3 .col-stacked .stat-box { border: none; padding: 2px; text-align: center; }
  html.kt3 .col-stacked .stat-val { font-size: 15px; font-weight: bold; }
  html.kt3 .col-stacked .stat-lbl { font-size: 9px; opacity: 0.8; }
  html.kt3 .card { border: 3px solid #000; padding: 12px 14px; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  html.kt3 .cols.custom-layout .card { flex: 1 1 calc(50% - 7px); min-width: 300px; }
  html.kt3 .cols.custom-layout .card.full-width { flex: 0 0 100%; min-width: 100%; }
  html.kt3 .card h2 { font-size: 20px; margin-bottom: 10px; border-bottom: 2px solid #000; padding-bottom: 4px; gap: 8px; }
  html.kt3 .card h2 .logo { width: 26px; height: 26px; flex: 0 0 26px; }
  html.kt3 .row { margin: 6px 0; }
  html.kt3 .row .label { font-size: 15px; margin-bottom: 3px; }
  html.kt3 .bar { height: 18px; border: 2px solid #000; }
  html.kt3 .reset { font-size: 13px; margin-top: 3px; }
  html.kt3 .sub { font-size: 14px; margin-top: 6px; line-height: 1.3; }
  html.kt3 .big { font-size: 22px; }
  html.kt3 .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin: 8px 0; }
  html.kt3 .stat-box { border: 2px solid #000; padding: 6px 8px; text-align: center; }
  html.kt3 .stat-val { font-size: 18px; font-weight: bold; }
  html.kt3 .stat-lbl { font-size: 11px; opacity: 0.8; font-weight: bold; text-transform: uppercase; margin-top: 2px; }
  html.kt3 .model-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  html.kt3 .model-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 3px 0; border-bottom: 1px dotted #666; }
  html.kt3 .model-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  html.kt3 .model-detail { font-size: 12px; white-space: nowrap; }

  .stage {
    position: absolute; top: 50%; left: 50%;
    width: 1448px; height: 1072px;
    transform: translate(-50%, -50%) rotate(90deg);
    transform-origin: center center;
    padding: 28px 36px; display: flex; flex-direction: column;
  }
  html.desktop, html.desktop body { width: 100%; height: 100%; }
  html.desktop .stage {
    position: relative; top: auto; left: auto;
    width: 100vw; height: 100vh;
    transform: none;
  }
  html.capture-landscape,
  html.capture-landscape body {
    width: calc(1448px * var(--capture-scale));
    height: calc(1072px * var(--capture-scale));
  }
  html.capture-landscape .stage {
    position: absolute; top: 0; left: 0;
    width: 1448px; height: 1072px;
    transform: scale(var(--capture-scale));
    transform-origin: top left;
  }
  /* PiP: janela flutuante no PC. Sem moldura, entao todo o corpo arrasta a janela. */
  html.pip body { -webkit-app-region: drag; cursor: move; }
  html.pip .stage { box-shadow: inset 0 0 0 4px #000; }
  /* Botao fechar: fora do conteudo (position fixed), invisivel ate o hover, para
     nao interferir na visualizacao. -webkit-app-region: no-drag = clicavel. */
  #pip-close { display: none; }
  html.pip #pip-close {
    display: flex; align-items: center; justify-content: center;
    position: fixed; top: 6px; right: 6px; z-index: 10;
    width: 26px; height: 26px; padding: 0;
    border: none; border-radius: 50%;
    background: rgba(0, 0, 0, 0.6); color: #fff;
    font: 18px/1 Helvetica, Arial, sans-serif; cursor: pointer;
    opacity: 0; transition: opacity 0.15s ease;
    -webkit-app-region: no-drag;
  }
  html.pip:hover #pip-close { opacity: 1; }
  html.pip #pip-close:hover { background: #000; }

  header {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 6px solid #000; padding-bottom: 16px; margin-bottom: 26px;
  }
  h1 { font-size: 52px; letter-spacing: -1px; }
  .stamp { font-size: 28px; text-align: right; }

  .cols { display: flex; gap: 28px; flex: 1; }
  .col-stacked { display: flex; flex-direction: column; gap: 20px; flex: 1; min-width: 0; }
  .col-stacked .card { flex: 1; }
  .card { flex: 1; border: 4px solid #000; padding: 24px 26px; display: flex; flex-direction: column; }
  .card h2 {
    display: flex; align-items: center; gap: 16px;
    font-size: 40px; margin-bottom: 22px; border-bottom: 3px solid #000; padding-bottom: 10px;
  }
  .card h2 .logo { width: 48px; height: 48px; flex: 0 0 48px; fill: #000; }

  .row { margin: 18px 0; }
  .row .label { display: flex; justify-content: space-between; font-size: 30px; font-weight: bold; margin-bottom: 8px; }
  .bar { height: 40px; border: 3px solid #000; }
  .bar > i { display: block; height: 100%; background: #000; }
  .reset { font-size: 34px; margin-top: 10px; }

  .notify-banner {
    background: #000; color: #fff; padding: 6px 12px; font-size: 15px; font-weight: bold;
    margin-bottom: 10px; border: 2px solid #000; text-align: center;
  }
  .sub { font-size: 28px; margin-top: 14px; line-height: 1.35; }
  .big { font-size: 46px; font-weight: bold; margin-top: auto; }
  .dim { opacity: 0.55; }

  /* Grade de módulos (12 colunas) e ajuste automático do texto ao card */
  .stage > .cols { min-height: 0; }
  .card { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  .card h2 > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-body { flex: 1 1 auto; min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
  .card-fit { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
  /* Grade de números e listas no layout grande (o modo kt3 sobrescreve abaixo). */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 14px 0; }
  .stat-box { border: 3px solid #000; padding: 10px 12px; text-align: center; }
  .stat-val { font-size: 34px; font-weight: bold; }
  .stat-lbl { font-size: 18px; font-weight: bold; text-transform: uppercase; opacity: 0.8; margin-top: 4px; }
  .model-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .model-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 24px; padding: 4px 0; border-bottom: 2px dotted #666; }
  .model-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .model-detail { font-size: 22px; white-space: nowrap; }
  /* Logo do título acompanha o tamanho da fonte (ajustado em JS para todos os cards). */
  html.kt3 .card h2 .logo { width: 1.3em; height: 1.3em; flex: 0 0 1.3em; }
  /* Linhas que não devem quebrar: limitam o crescimento do texto pela largura. */
  .drive-sub, .row .label, .net-up, .net-chart-cap span, .stat-val, .model-row { white-space: nowrap; }
  html .cols.grid-layout {
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr); grid-auto-flow: row dense; gap: 28px;
  }
  html.kt3 .cols.grid-layout { display: grid; gap: 12px; }
  html .cols.grid-layout > .card { flex: none; }

  /* Modo de edição (?edit=1) */
  .resize-handle, .size-badge { display: none; }
  html.editing .cols.grid-layout > .card { cursor: grab; outline: 2px dashed #888; outline-offset: 1px; touch-action: none; user-select: none; }
  html.editing .cols.grid-layout > .card:hover { outline-color: #000; }
  html.editing .card.dragging { opacity: 0.45; pointer-events: none; cursor: grabbing; z-index: 5; }
  html.editing .card.drop-before { box-shadow: -7px 0 0 0 #000; }
  html.editing .card.drop-after { box-shadow: 7px 0 0 0 #000; }
  html.editing .resize-handle {
    display: block; position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; z-index: 3;
    background: linear-gradient(135deg, transparent 0 50%, #000 50% 100%);
  }
  html.editing .card.resizing .size-badge {
    display: block; position: absolute; right: 26px; bottom: 4px; z-index: 3;
    background: #000; color: #fff; font: bold 13px Helvetica, Arial, sans-serif; padding: 2px 7px;
  }
  html.editing header { position: relative; }
  html.editing #title { outline: 2px dashed #888; outline-offset: 2px; cursor: text; min-width: 3ch; }
  html.editing #title:focus { outline: 2px solid #000; }
  html.editing #stamp { outline: 2px dashed #888; outline-offset: 2px; cursor: pointer; min-width: 4ch; }
  #edit-bar {
    position: fixed; right: 8px; bottom: 8px; z-index: 20; opacity: 0.55; transition: opacity 0.15s ease;
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
    background: rgba(0, 0, 0, 0.88); color: #fff; font: 600 12px Helvetica, Arial, sans-serif;
    padding: 6px 10px; border-radius: 8px;
  }
  #edit-bar:hover { opacity: 1; }
  #edit-hint { max-width: 0; overflow: hidden; transition: max-width 0.2s ease; }
  #edit-bar:hover #edit-hint { max-width: 640px; }
  #edit-bar button { font: inherit; background: #fff; color: #000; border: 0; border-radius: 5px; padding: 3px 8px; cursor: pointer; }
  #edit-status { opacity: 0.8; min-width: 5ch; }
  #header-pop {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 220px;
    display: flex; flex-direction: column; gap: 7px; padding: 10px 12px;
    background: #fff; border: 2px solid #000; box-shadow: 4px 4px 0 #000;
    font: 600 13px Helvetica, Arial, sans-serif; text-align: left;
  }
  #header-pop[hidden] { display: none; }
  #header-pop label { display: flex; align-items: center; gap: 8px; }
  #header-pop input[type=text] { flex: 1; font: inherit; border: 2px solid #000; padding: 3px 5px; min-width: 0; }

  /* Sistema / Armazenamento / Rede */
  .meter-sub { font-size: 24px; margin-top: 6px; }
  .sys-info { font-size: 24px; font-weight: bold; margin: 2px 0 10px; }
  .sys-uptime { font-size: 22px; margin-top: 8px; }
  .drive-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); column-gap: 28px; }
  html.kt3 .drive-list { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); column-gap: 14px; }
  .drive { margin: 14px 0; min-width: 0; }
  .drive-head { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: bold; margin-bottom: 6px; }
  .drive-kind { background: #000; color: #fff; padding: 2px 10px; font-size: 22px; letter-spacing: 0.5px; flex: 0 0 auto; }
  .drive-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drive-pct { flex: 0 0 auto; }
  .drive .bar { height: 22px; }
  .drive-sub { font-size: 22px; margin-top: 4px; }
  .drive-more { font-size: 22px; font-weight: bold; margin-top: 4px; }
  .net-hero { border: 4px solid #000; padding: 10px 16px 12px; margin: 4px 0 12px; }
  .net-label { font-size: 24px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
  .net-big { font-size: 120px; font-weight: 900; line-height: 1; letter-spacing: -3px; white-space: nowrap; }
  .net-unit { font-size: 44px; font-weight: bold; letter-spacing: 0; }
  .net-bytes { font-size: 24px; font-weight: bold; margin-top: 4px; }
  .net-up { display: flex; justify-content: space-between; align-items: baseline; font-size: 34px; font-weight: bold; margin: 6px 0; }
  .net-chart { margin: 8px 0 4px; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 60px; }
  .net-chart svg { display: block; width: 100%; height: 0; flex: 1 1 0; min-height: 30px; }
  .net-chart-cap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; font-size: 20px; font-weight: bold; margin-top: 4px; }
  .net-chart-cap span { white-space: nowrap; }
  .net-meta { font-size: 22px; margin-top: 6px; line-height: 1.35; }

  html.kt3 .meter-sub { font-size: 12px; margin-top: 2px; }
  html.kt3 .sys-info { font-size: 13px; margin: 2px 0 6px; }
  html.kt3 .sys-uptime { font-size: 12px; margin-top: 4px; }
  html.kt3 .drive { margin: 5px 0; }
  html.kt3 .drive-head { gap: 6px; font-size: 13px; margin-bottom: 2px; }
  html.kt3 .drive-kind { font-size: 10px; padding: 1px 5px; }
  html.kt3 .drive .bar { height: 10px; border-width: 2px; }
  html.kt3 .drive-sub { font-size: 11px; margin-top: 1px; }
  html.kt3 .drive-more { font-size: 11px; margin-top: 2px; }
  html.kt3 .net-hero { border-width: 3px; padding: 4px 10px 6px; margin: 0 0 6px; }
  html.kt3 .net-label { font-size: 12px; }
  html.kt3 .net-big { font-size: 54px; letter-spacing: -1.5px; }
  html.kt3 .net-unit { font-size: 22px; }
  html.kt3 .net-bytes { font-size: 12px; margin-top: 1px; }
  html.kt3 .net-up { font-size: 16px; margin: 3px 0; }
  html.kt3 .net-chart { margin: 4px 0 2px; min-height: 28px; }
  html.kt3 .net-chart svg { min-height: 14px; }
  html.kt3 .net-chart-cap { gap: 0 6px; }
  html.kt3 .net-chart-cap { font-size: 10px; margin-top: 1px; }
  html.kt3 .net-meta { font-size: 11px; margin-top: 3px; }
</style>
</head>

  function locale() {

  function esc(value) {

  // Velocidade de rede em bits/s (convenção de provedores): { value, unit }.

    if (bits >= 1e9) return { value: num(bits / 1e9, 2), unit: 'Gbps' };
    if (bits >= 1e6) return { value: num(bits / 1e6, bits >= 1e8 ? 0 : 1), unit: 'Mbps' };
    if (bits >= 1e3) return { value: num(bits / 1e3, 0), unit: 'Kbps' };

    var b = Math.max(0, Number(bytes) || 0);

  var DRIVE_KIND_KEYS = { nvme: 'driveNvme', ssd: 'driveSsd', hdd: 'driveHdd', flash: 'driveFlash', sd: 'driveSd', network: 'driveNetwork' };

  function renderSystemCard(t, opt) {
    var h = '';
    if (opt.sysInfo !== false) {
      h += '<div class="sys-info">' + esc(t.model || '') + ' · ' + esc(t.osRelease || '') +

      h += meter(copy('ram') + ' (' + esc(t.memUsedGb || 0) + ' / ' + esc(t.memTotalGb || 0) + ' GB)', percent(t.memPct || 0), t.memPct || 0);
    }
    if (opt.temperature !== false) {
      var extras = [];
      if (t.cpuTempMaxC != null && t.cpuTempC != null && t.cpuTempMaxC - t.cpuTempC >= 3) extras.push(copy('peakShort') + ' ' + Math.round(t.cpuTempMaxC) + '°C');
      if (t.ssdTempC != null) extras.push(copy('ssdTemp') + ' ' + Math.round(t.ssdTempC) + '°C');
      if (t.batteryTempC != null) extras.push(copy('batteryTemp') + ' ' + Math.round(t.batteryTempC) + '°C');
      if (t.thermalState && t.thermalState !== 'nominal') extras.push('⚠ ' + copy(THERMAL_KEYS[t.thermalState] || 'thermalNominal'));
      if (t.cpuTempC != null) {

  function renderStorageCard(t, opt) {
    var drives = (t.drives || []).filter(function (d) {

  function renderNetChart(points) {
    var list = (points || []).slice(-20);
    if (list.length < 2) return '';
    var slots = 20;
    var w = 200;
    var h = 40;
    var maxVal = Math.max.apply(null, list) || 1;
    var slotW = w / slots;
    var offset = slots - list.length;
    var bars = list.map(function (v, i) {
      var bh = v > 0 ? Math.max(2, Math.round((v / maxVal) * (h - 2))) : 1;
      return '<rect x="' + ((offset + i) * slotW + 1).toFixed(1) + '" y="' + (h - bh) + '" width="' + (slotW - 2).toFixed(1) + '" height="' + bh + '" fill="#000"/>';
    }).join('');

  function renderNetworkCard(t, opt) {
    var down = formatRate(t.downloadBps);
    var h = '<div class="net-hero">' +
            '<div class="net-label">▼ ' + copy('download') + '</div>' +
            '<div class="net-big">' + down.value + ' <span class="net-unit">' + down.unit + '</span></div>' +

      var up = formatRate(t.uploadBps);
      h += '<div class="net-up"><span>▲ ' + copy('upload') + '</span><span>' + up.value + ' ' + up.unit + '</span></div>';
    }
    if (opt.showChart !== false) {
      var chart = renderNetChart(t.downloadHistoryBps);
      if (chart) {
        var cap = '<span>▼ ' + copy('last10min') + '</span>';
        if (opt.showPeak !== false) {
          var pk = formatRate(t.peakDownloadBps);

        }

      var kindName = t.portName || copy(NET_KIND_KEYS[t.kind] || 'netOther');

  function renderSvgPieChart(items) {

    var currentAngle = -Math.PI / 2;
    var paths = '';
    items.slice(0, 4).forEach(function(it, idx) {
      var val = it.tokens || it.pct || 1;
      var slice = (val / total) * 2 * Math.PI;
      var x1 = cx + r * Math.cos(currentAngle);
      var y1 = cy + r * Math.sin(currentAngle);
      var x2 = cx + r * Math.cos(currentAngle + slice);
      var y2 = cy + r * Math.sin(currentAngle + slice);

      var fill = (idx === 0) ? '#000000' : (idx === 1) ? '#888888' : (idx === 2) ? '#cccccc' : '#ffffff';

      paths += '<path d="' + d + '" fill="' + fill + '" stroke="#000" stroke-width="2"/>';

  function renderSvgHistoryChart(title, dataPoints) {

  function cardMarkup(t, blockCfg) {

    var opt = Object.assign({}, (window.__CURRENT_OPTIONS__ && window.__CURRENT_OPTIONS__[t.tool]) || {}, (blockCfg && blockCfg.options) || {});
    var extraClass = (blockCfg && blockCfg.width === 'full') ? ' full-width' : '';

             '<div class="stat-box"><div class="stat-val">' + stepsStr + '</div><div class="stat-lbl">Passos Sessão</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + statusBadge + '</div><div class="stat-lbl">Status</div></div>' +

    if (t.tool === 'tamagotchi') {

           '</div>';

      h += '<div style="display:flex;align-items:center;gap:12px;margin:8px 0 6px">' +

           (t.svgMono || ('<div style="font-family:monospace;font-size:14px;padding:8px">' + (t.spriteAscii || '(=^･ω･^=)') + '</div>')) +
           '</div>' +
           '<div style="flex:1">';

      if (opt.showBars !== false) {
        h += '<div class="row"><div class="label"><span>Fome</span><span>' + (t.hunger || 0) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.hunger || 0) + '%"></i></div></div>';
        h += '<div class="row"><div class="label"><span>Felicidade</span><span>' + (t.happiness || 0) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.happiness || 0) + '%"></i></div></div>';
        h += '<div class="row"><div class="label"><span>Energia</span><span>' + (t.energy || 0) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.energy || 0) + '%"></i></div></div>';
        h += '<div class="row"><div class="label"><span>Limpeza</span><span>' + (t.cleanliness != null ? t.cleanliness : 100) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.cleanliness != null ? t.cleanliness : 100) + '%"></i></div></div>';
      }
      h += '</div></div>';

      // Frase motivacional diária do mascote para a tela do Kindle
      var quote = t.dailyQuote || 'Codando igual um condenado? Beba água, senão mordo seu pé! ☕🐾';
      h += '<div style="margin-top:8px;padding:6px 10px;border:1.5px solid #000;border-radius:6px;background:#f8f8f8;display:flex;align-items:flex-start;gap:8px">' +
           '<span style="font-size:16px;line-height:1">💬</span>' +
           '<div style="flex:1">' +
           '<div style="font-size:10px;text-transform:uppercase;font-weight:bold;letter-spacing:0.5px;opacity:0.75;margin-bottom:2px">' + (t.name || 'Mascote') + ' diz:</div>' +
           '<div style="font-size:13px;font-style:italic;font-weight:600;line-height:1.3;color:#000">"' + quote + '"</div>' +
           '</div></div>';

      return h + '</div>';
    }

    if (t.tool === 'opencode') {
      var statusBadge = t.status === 'Ativo' ? '● Ativo' : '○ Ocioso';
      var modelName = t.model || 'Ollama Local';
      if (opt.modelInfo !== false) {
        h += '<div style="display:flex;align-items:center;justify-content:space-between;margin:2px 0 6px">' +
             '<span style="font-size:13px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px">🤖 ' + modelName + '</span>' +
             '<span style="font-size:12px;opacity:0.8">' + statusBadge + '</span>' +
             '</div>';
      }

      var formatTok = function(n) {
        if (!n) return '0';
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(0) + 'k';
        return String(n);
      };

      if (opt.statGrid !== false) {
        h += '<div class="stat-grid" style="margin:4px 0 6px">' +
             '<div class="stat-box"><div class="stat-val">' + (t.totalSessions || 0) + '</div><div class="stat-lbl">Sessões</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + (t.totalMessages || 0) + '</div><div class="stat-lbl">Mensagens</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + formatTok(t.totalTokens || 0) + '</div><div class="stat-lbl">Tokens Totais</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + formatTok(t.cacheReadTokens || 0) + '</div><div class="stat-lbl">Cache Read</div></div>' +
             '</div>';
      }

      if (opt.activeSession !== false && t.activeSession) {
        h += '<div style="margin:4px 0 6px;padding:4px 8px;border:1.5px solid #000;border-radius:5px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
             '<strong>Última Sessão:</strong> ' + t.activeSession + '</div>';
      }

      if (opt.historyChart !== false && Array.isArray(t.historyPoints)) {
        h += renderSvgHistoryChart('Mensagens OpenCode (7 dias)', t.historyPoints);
      }

      return h + '</div>';
    }

    if (t.tool === 'sitescraper') {
      var sites = t.sites || [];
      if (sites.length === 0) {
        h += '<div class="sub dim" style="margin-top:10px">Nenhum site configurado ou aguardando sincronização.</div>';
      } else {
        sites.forEach(function(s, idx) {
          if (idx > 0) h += '<div style="border-top:1px dashed #ccc;margin:8px 0"></div>';
          h += '<div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 2px">' +
               '<strong style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px">🌐 ' + (s.name || s.url) + '</strong>' +
               '<span style="font-size:11px;opacity:0.7">' + (s.updatedAt || '') + '</span>' +
               '</div>';
          var posts = s.posts || [];
          if (posts.length === 0) {
            h += '<div class="sub dim" style="font-size:12px">Sem novos posts</div>';
          } else {
            var limit = opt.maxItems || 3;
            posts.slice(0, limit).forEach(function(p) {
              h += '<div style="margin:3px 0;display:flex;align-items:baseline;justify-content:space-between;gap:6px">' +
                   '<span style="font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">• ' + p.title + '</span>' +
                   (opt.showDate !== false && p.date ? '<span style="font-size:11px;opacity:0.65;flex-shrink:0">' + p.date + '</span>' : '') +
                   '</div>';
            });
          }
        });
      }
      return h + '</div>';
    }

    (t.windows || []).forEach(function (w) { h += bar(w.name, w.pct, w.resets_at); });
    (t.stale_windows || []).forEach(function (w) { h += staleBar(w.name); });
    if (t.noteKey) h += '<div class="sub dim">! ' + copy(t.noteKey) + '</div>';
    if (t.extra) {
      h += '<div class="sub">' + copy('extraUsage') + '</div>';
      if (typeof t.extra.current_balance === 'number') {
        h += '<div class="sub">' + copy('currentBalance') + ': ' + money(t.extra.current_balance, t.extra.currency) + '</div>';
      }
      h += '<div class="sub">' + copy('spent') + ': ' + money(t.extra.used_credits, t.extra.currency) +
           ' · ' + copy('monthlyLimit') + ': ' + money(t.extra.monthly_limit, t.extra.currency) +
           '<br>(' + percent(t.extra.pct) + ' ' + copy('used') + ')</div>';
    }
    if (t.tokens) {
      h += '<div class="sub">' + copy('tokens') + ': ' + t.tokens.total.toLocaleString(locale()) + '</div>';
    }
    if (t.spend) {
      h += '<div class="big">' + money(Math.round(t.spend.usd * 100), 'USD') + '</div>' +
           '<div class="sub dim">' + t.spend.sessions + ' ' + copy('sessions') + ' · ' + copy('goLimits') + '</div>';
    }
    return h + '</div>';
  }

  // ---------------------------------------------------------- grade ----
  var GRID_COLS = 12;
  var MAX_ROWS = 6;
  var FIT_MIN = 0.5;
  var FIT_MAX = 1.6;
  var EDIT = params.get('edit') === '1';
  var state = { data: null, blocks: null };

  function clampInt(n, lo, hi) {
    n = Math.round(Number(n));
    if (!isFinite(n)) n = lo;
    return Math.max(lo, Math.min(hi, n));
  }

  // Blocos antigos usam width (half/full) e height (standard/tall); os novos, w/h na grade.
  function normalizeBlock(b) {
    var w = b.w != null ? b.w : (b.width === 'full' ? GRID_COLS : GRID_COLS / 2);
    var h = b.h != null ? b.h : (b.height === 'tall' ? 2 : 1);
    return Object.assign({}, b, { w: clampInt(w, 2, GRID_COLS), h: clampInt(h, 1, MAX_ROWS) });
  }

  function serializeBlock(b) {
    var out = { id: b.id, tool: b.tool, w: b.w, h: b.h, width: b.w >= GRID_COLS ? 'full' : 'half', height: b.h >= 2 ? 'tall' : 'standard' };
    if (b.options) out.options = b.options;
    if (b.siteId) out.siteId = b.siteId;
    return out;
  }

  // Envolve o conteúdo do card num corpo de tamanho fixo (para o ajuste de texto)
  // e marca o card com o bloco/ferramenta e o tamanho na grade.
  function card(t, blockCfg) {
    var html = cardMarkup(t, blockCfg);
    var i = html.indexOf('</h2>');
    if (i === -1 || html.slice(-6) !== '</div>') return html;
    var attrs = ' data-tool="' + esc(t.tool) + '"' + (blockCfg && blockCfg.id ? ' data-block="' + esc(blockCfg.id) + '"' : '');
    if (blockCfg && blockCfg._w) {
      attrs += ' data-w="' + blockCfg._w + '" data-h="' + blockCfg._h + '"' +
               ' style="grid-column: ' + (blockCfg._c + 1) + ' / span ' + blockCfg._w + '; grid-row: ' + (blockCfg._r + 1) + ' / span ' + blockCfg._h + '"';
    }
    html = html.replace('<div class="card', '<div' + attrs + ' class="card');
    i = html.indexOf('</h2>');
    var handles = EDIT && blockCfg && blockCfg.id ? '<span class="resize-handle" title="' + esc(copy('editResize')) + '"></span><span class="size-badge"></span>' : '';
    return html.slice(0, i + 5) + '<div class="card-body"><div class="card-fit">' + html.slice(i + 5, -6) + '</div></div>' + handles + '</div>';
  }

  // Posiciona os blocos na grade (primeiro encaixe, como grid-auto-flow: dense)
  // e estica cada card para ocupar células vazias ao redor, para não sobrar
  // espaço. O tamanho salvo (w/h) não muda; o esticamento é só de exibição.
  function packBlocks(blocks) {
    var cells = [];
    function rowAt(r) {
      if (!cells[r]) { cells[r] = []; for (var x = 0; x < GRID_COLS; x++) cells[r][x] = false; }
      return cells[r];
    }
    function isFree(r, c) { return !(cells[r] && cells[r][c]); }
    function areaFree(r, c, w, h) {
      for (var y = r; y < r + h; y++) for (var x = c; x < c + w; x++) if (!isFree(y, x)) return false;
      return true;
    }
    function fill(r, c, w, h) {
      for (var y = r; y < r + h; y++) { var row = rowAt(y); for (var x = c; x < c + w; x++) row[x] = true; }
    }
    var items = blocks.map(function (b) {
      var w = Math.min(GRID_COLS, b.w);
      var h = b.h;
      for (var r = 0; r < 200; r++) {
        for (var c = 0; c + w <= GRID_COLS; c++) {
          if (areaFree(r, c, w, h)) { fill(r, c, w, h); return { block: b, c: c, r: r, w: w, h: h }; }
        }
      }
      return { block: b, c: 0, r: 0, w: w, h: h };
    });
    var rows = cells.length;
    function colFree(p, x) { for (var y = p.r; y < p.r + p.h; y++) if (!isFree(y, x)) return false; return true; }
    function rowFree(p, y) { if (y >= rows) return false; for (var x = p.c; x < p.c + p.w; x++) if (!isFree(y, x)) return false; return true; }
    // Buracos à esquerda, depois à direita, depois abaixo.
    items.forEach(function (p) { while (p.c > 0 && colFree(p, p.c - 1)) { p.c--; p.w++; fill(p.r, p.c, 1, p.h); } });
    items.forEach(function (p) { while (p.c + p.w < GRID_COLS && colFree(p, p.c + p.w)) { fill(p.r, p.c + p.w, 1, p.h); p.w++; } });
    items.forEach(function (p) { while (rowFree(p, p.r + p.h)) { fill(p.r + p.h, p.c, p.w, 1); p.h++; } });
    return { items: items, rows: Math.max(1, rows) };
  }

  // Um tamanho de título para todos os cards: o maior que cabe em todos.
  function fitTitles() {
    var titles = [].slice.call(document.querySelectorAll('#cols .card h2'));
    if (!titles.length) return;
    titles.forEach(function (h2) { h2.style.fontSize = ''; });
    var base = parseFloat(getComputedStyle(titles[0]).fontSize) || 20;
    function allFit() {
      return titles.every(function (h2) {
        var span = h2.querySelector('span');
        return !span || span.scrollWidth <= span.clientWidth + 1;
      });
    }
    for (var f = 1; f >= 0.6; f -= 0.05) {
      var size = Math.round(base * f * 10) / 10 + 'px';
      titles.forEach(function (h2) { h2.style.fontSize = size; });
      if (allFit()) return;
    }
  }

  // Ajusta o "zoom" do conteúdo de cada card para caber no espaço disponível:
  // encolhe quando falta espaço e cresce (até FIT_MAX) em cards grandes.
  function fitCard(cardEl) {
    var body = cardEl.querySelector('.card-body');
    var inner = body && body.firstElementChild;
    if (!inner) return;
    inner.style.zoom = '';
    inner.style.width = '';
    inner.style.height = '';
    inner.style.flex = '';
    var W = body.clientWidth;
    var H = body.clientHeight;
    if (W < 10 || H < 10) return;

    // Mede o conteúdo (altura natural) com o zoom z e a largura equivalente.
    inner.style.flex = 'none';
    function measure(z) {
      inner.style.zoom = String(z);
      inner.style.width = ((W - 2) / z) + 'px';
      inner.style.height = 'auto';
      return { h: inner.scrollHeight, overflowX: inner.scrollWidth > inner.clientWidth + 1 };
    }
    function fits(z) {
      var m = measure(z);
      return !m.overflowX && m.h <= H / z + 1;
    }

    var lo = FIT_MIN;
    var hi = FIT_MAX;
    if (fits(1)) lo = 1; else hi = 1;
    if (lo === 1 && fits(FIT_MAX)) {
      lo = FIT_MAX;
    } else {
      for (var k = 0; k < 8; k++) {
        var mid = (lo + hi) / 2;
        if (fits(mid)) lo = mid; else hi = mid;
      }
    }
    var z = Math.floor(lo * 100) / 100;
    inner.style.flex = '';
    inner.style.zoom = String(z);
    inner.style.width = ((W - 2) / z) + 'px';
    inner.style.height = (H / z) + 'px';
  }

  function fitAll() {
    fitTitles();
    var cards = document.querySelectorAll('#cols .card');
    for (var i = 0; i < cards.length; i++) fitCard(cards[i]);
  }

  function renderHeader(data) {
    var cfg = data.header || {};
    var parts = [];
    var d = new Date(data.updatedAt || Date.now());
    if (cfg.text) parts.push(String(cfg.text));
    if (cfg.showDate !== false) parts.push(d.toLocaleDateString(locale()));
    if (cfg.showTime !== false) parts.push(d.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' }));
    if (cfg.showBattery !== false) {
      if (data.kindleStatus && data.kindleStatus.battery != null) {
        parts.push((data.kindleStatus.isCharging ? '⚡' : '🔋') + ' ' + data.kindleStatus.battery + '%');
      } else {
        parts.push('🔋 --%');
      }
    }
    var text = parts.join('  ');
    if (!text && EDIT) text = '＋ ' + copy('editHeaderEmpty');
    document.getElementById('stamp').textContent = text;
    var title = document.getElementById('title');
    if (document.activeElement !== title) {
      title.textContent = data.dashboardTitle || copy('title') || 'PaperDeck';
    }
  }

  function presetMarkup(tools) {
    var claudeIdx = -1;
    var antigravityIdx = -1;
    for (var i = 0; i < tools.length; i++) {
      if (tools[i].tool === 'claude') claudeIdx = i;
      if (tools[i].tool === 'antigravity') antigravityIdx = i;
    }
    if (claudeIdx !== -1 && antigravityIdx !== -1) {
      var others = tools.filter(function (t, idx) { return idx !== claudeIdx && idx !== antigravityIdx; });
      return '<div class="col-stacked">' + card(tools[claudeIdx]) + card(tools[antigravityIdx]) + '</div>' +
             others.map(function (t) { return card(t); }).join('');
    }
    return tools.map(function (t) { return card(t); }).join('');
  }

  function render(data) {
    state.data = data;
    window.__CURRENT_OPTIONS__ = data.widgetOptions || {};
    var notifyEl = document.getElementById('notify-box');
    if (data.notification) {
      notifyEl.textContent = '📢 ' + data.notification;
      notifyEl.style.display = 'block';
    } else {
      notifyEl.style.display = 'none';
    }

    var tools = data.tools || [];
    var layout = data.layout || {};
    var colsEl = document.getElementById('cols');
    var custom = layout.mode === 'custom' && Array.isArray(layout.blocks) && layout.blocks.length > 0;
    if (!state.blocks && custom) state.blocks = layout.blocks.map(normalizeBlock);

    if (state.blocks) {
      var toolsMap = {};
      tools.forEach(function (t) { toolsMap[t.tool] = t; });
      var visible = state.blocks.filter(function (b) { return toolsMap[b.tool]; });
      var packed = packBlocks(visible);
      colsEl.className = 'cols grid-layout';
      colsEl.style.gridTemplateRows = 'repeat(' + packed.rows + ', minmax(0, 1fr))';
      colsEl.innerHTML = packed.items.map(function (p) {
        return card(toolsMap[p.block.tool], Object.assign({}, p.block, { _c: p.c, _r: p.r, _w: p.w, _h: p.h }));
      }).join('');
    } else {
      colsEl.className = 'cols';
      colsEl.style.gridTemplateRows = '';
      colsEl.innerHTML = presetMarkup(tools);
    }

    renderHeader(data);
    fitAll();
    document.title = readyId ? 'READY:' + readyId : 'READY';
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitAll, 120);
  });

  // ------------------------------------------------------- edição ----
  // Ativada com ?edit=1 (prévia editável do app). Arrastar reposiciona,
  // o canto inferior direito redimensiona, o título e o canto superior
  // direito são editáveis. Tudo é salvo em /api/config.

  var editReady = false;
  var pendingPatch = null;
  var saveTimer = null;

  function setEditStatus(key) {
    var el = document.getElementById('edit-status');
    if (el) el.textContent = key ? copy(key) : '';
  }

  function saveConfig(patch) {
    pendingPatch = Object.assign(pendingPatch || {}, patch);
    setEditStatus('editSaving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var body = pendingPatch;
      pendingPatch = null;
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/config', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          setEditStatus('editSaved');
          try { window.parent.postMessage({ type: 'paperdeck:config-saved' }, '*'); } catch (_e) {}
        } else {
          setEditStatus('editError');
        }
      };
      xhr.onerror = function () { setEditStatus('editError'); };
      xhr.send(JSON.stringify(body));
    }, 350);
  }

  function saveLayout() {
    var layout = { mode: 'custom', blocks: state.blocks.map(serializeBlock) };
    state.data.layout = layout;
    saveConfig({ layout: layout });
  }

  // Converte o layout automático (preset) em blocos da grade, medindo os cards.
  function snapshotBlocks() {
    var colsEl = document.getElementById('cols');
    var box = colsEl.getBoundingClientRect();
    var cards = [].slice.call(colsEl.querySelectorAll('.card[data-tool]'));
    if (!cards.length || !box.width) return [];
    var minH = Math.min.apply(null, cards.map(function (c) { return c.getBoundingClientRect().height; })) || 1;
    var items = cards.map(function (c, i) {
      var r = c.getBoundingClientRect();
      var c0 = Math.round(((r.left - box.left) / box.width) * GRID_COLS);
      var c1 = Math.round(((r.right - box.left) / box.width) * GRID_COLS);
      var tool = c.getAttribute('data-tool');
      return {
        top: r.top,
        left: r.left,
        block: { id: 'b_' + tool + '_' + i, tool: tool, w: clampInt(c1 - c0, 2, GRID_COLS), h: clampInt(r.height / minH, 1, MAX_ROWS) }
      };
    });
    items.sort(function (a, b) { return Math.abs(a.top - b.top) > 4 ? a.top - b.top : a.left - b.left; });
    return items.map(function (it) { return it.block; });
  }

  function stageScale() {
    var stage = document.querySelector('.stage');
    return stage && stage.offsetWidth ? stage.getBoundingClientRect().width / stage.offsetWidth : 1;
  }

  function findBlockIndex(id) {
    for (var i = 0; i < state.blocks.length; i++) if (state.blocks[i].id === id) return i;
    return -1;
  }

  function clearDropMarks() {
    var marked = document.querySelectorAll('.drop-before, .drop-after');
    for (var i = 0; i < marked.length; i++) marked[i].classList.remove('drop-before', 'drop-after');
  }

  function initEdit() {
    document.documentElement.classList.add('editing');

    var bar = document.createElement('div');
    bar.id = 'edit-bar';
    bar.innerHTML = '<span aria-hidden="true">✎</span><span id="edit-hint">' + esc(copy('editHint')) + '</span><button type="button" id="edit-auto">' + esc(copy('editAuto')) + '</button><span id="edit-status"></span>';
    document.body.appendChild(bar);

    // Título editável.
    var title = document.getElementById('title');
    title.setAttribute('contenteditable', 'plaintext-only');
    title.setAttribute('spellcheck', 'false');
    title.title = copy('editTitle');
    title.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); title.blur(); }
    });
    title.addEventListener('blur', function () {
      var value = title.textContent.replace(/\s+/g, ' ').trim().slice(0, 60);
      if (!value) value = 'PaperDeck';
      title.textContent = value;
      if (value !== state.data.dashboardTitle) {
        state.data.dashboardTitle = value;
        saveConfig({ dashboardTitle: value });
      }
    });

    // Canto superior direito: o que mostrar.
    var header = document.querySelector('header');
    var stamp = document.getElementById('stamp');
    var pop = document.createElement('div');
    pop.id = 'header-pop';
    pop.hidden = true;
    pop.innerHTML =
      '<label><input type="checkbox" data-k="showDate"> ' + esc(copy('headerDate')) + '</label>' +
      '<label><input type="checkbox" data-k="showTime"> ' + esc(copy('headerTime')) + '</label>' +
      '<label><input type="checkbox" data-k="showBattery"> ' + esc(copy('headerBattery')) + '</label>' +
      '<label>' + esc(copy('headerText')) + ' <input type="text" data-k="text" maxlength="40" placeholder="' + esc(copy('headerTextPlaceholder')) + '"></label>';
    header.appendChild(pop);
    stamp.title = copy('editHeader');
    stamp.addEventListener('click', function (e) {
      e.stopPropagation();
      var cfg = state.data.header || {};
      var inputs = pop.querySelectorAll('input');
      for (var i = 0; i < inputs.length; i++) {
        var k = inputs[i].getAttribute('data-k');
        if (inputs[i].type === 'checkbox') inputs[i].checked = cfg[k] !== false;
        else inputs[i].value = cfg[k] || '';
      }
      pop.hidden = !pop.hidden;
    });
    pop.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', function () { pop.hidden = true; });
    pop.addEventListener('input', function (e) {
      var input = e.target;
      var k = input.getAttribute('data-k');
      if (!k) return;
      var cfg = Object.assign({ showDate: true, showTime: true, showBattery: true, text: '' }, state.data.header || {});
      cfg[k] = input.type === 'checkbox' ? input.checked : input.value.slice(0, 40);
      state.data.header = cfg;
      renderHeader(state.data);
      saveConfig({ header: cfg });
    });

    // Layout automático: volta ao preset (e reconverte em grade para continuar editando).
    document.getElementById('edit-auto').addEventListener('click', function () {
      state.blocks = null;
      state.data.layout = { mode: 'preset', blocks: [] };
      render(state.data);
      state.blocks = snapshotBlocks();
      render(state.data);
      saveConfig({ layout: { mode: 'preset', blocks: [] } });
    });

    // Arrastar e redimensionar.
    var colsEl = document.getElementById('cols');
    var drag = null;

    colsEl.addEventListener('pointerdown', function (e) {
      if (e.button !== 0 || !state.blocks) return;
      var cardEl = e.target.closest('.card[data-block]');
      if (!cardEl) return;
      var idx = findBlockIndex(cardEl.getAttribute('data-block'));
      if (idx === -1) return;
      e.preventDefault();
      var gap = parseFloat(getComputedStyle(colsEl).columnGap) || 0;
      drag = {
        mode: e.target.classList.contains('resize-handle') ? 'resize' : 'move',
        el: cardEl,
        idx: idx,
        x0: e.clientX,
        y0: e.clientY,
        rect: cardEl.getBoundingClientRect(),
        gridWidth: colsEl.getBoundingClientRect().width,
        gap: gap,
        scale: stageScale(),
        started: false,
        w: Number(cardEl.getAttribute('data-w')) || state.blocks[idx].w,
        h: Number(cardEl.getAttribute('data-h')) || state.blocks[idx].h,
        shownH: Number(cardEl.getAttribute('data-h')) || state.blocks[idx].h,
        shownW: Number(cardEl.getAttribute('data-w')) || state.blocks[idx].w,
        target: null,
        after: false
      };
      if (drag.mode === 'resize') {
        drag.started = true;
        cardEl.classList.add('resizing');
      }
    });

    document.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = (e.clientX - drag.x0);
      var dy = (e.clientY - drag.y0);
      if (drag.mode === 'resize') {
        var s = drag.scale;
        var colW = (drag.gridWidth + drag.gap * s) / GRID_COLS;
        var rowUnit = (drag.rect.height + drag.gap * s) / drag.shownH;
        drag.w = clampInt((drag.rect.width + dx + drag.gap * s) / colW, 2, GRID_COLS);
        drag.h = clampInt((drag.rect.height + dy + drag.gap * s) / rowUnit, 1, MAX_ROWS);
        var area = drag.el.style;
        area.gridColumnEnd = 'span ' + drag.w;
        area.gridRowEnd = 'span ' + drag.h;
        var badge = drag.el.querySelector('.size-badge');
        if (badge) badge.textContent = drag.w + ' × ' + drag.h;
        return;
      }
      if (!drag.started) {
        if (Math.abs(dx) + Math.abs(dy) < 6) return;
        drag.started = true;
        drag.el.classList.add('dragging');
      }
      drag.el.style.transform = 'translate(' + (dx / drag.scale) + 'px,' + (dy / drag.scale) + 'px)';
      clearDropMarks();
      var under = document.elementFromPoint(e.clientX, e.clientY);
      var target = under && under.closest ? under.closest('.card[data-block]') : null;
      drag.target = target && target !== drag.el ? target : null;
      if (drag.target) {
        var tr = drag.target.getBoundingClientRect();
        drag.after = e.clientX > tr.left + tr.width / 2;
        drag.target.classList.add(drag.after ? 'drop-after' : 'drop-before');
      }
    });

    function endDrag() {
      if (!drag) return;
      var d = drag;
      drag = null;
      clearDropMarks();
      d.el.classList.remove('dragging', 'resizing');
      d.el.style.transform = '';
      if (!d.started) return;
      if (d.mode === 'resize') {
        var b = state.blocks[d.idx];
        if ((d.w === d.shownW && d.h === d.shownH) || (b.w === d.w && b.h === d.h)) { render(state.data); return; }
        b.w = d.w;
        b.h = d.h;
      } else {
        if (!d.target) { render(state.data); return; }
        var moved = state.blocks.splice(d.idx, 1)[0];
        var to = findBlockIndex(d.target.getAttribute('data-block'));
        state.blocks.splice(d.after ? to + 1 : to, 0, moved);
      }
      render(state.data);
      saveLayout();
    }
    document.addEventListener('pointerup', endDrag);
    document.addEventListener('pointercancel', endDrag);

    // Sem layout próprio: converte o automático em grade para poder editar.
    if (!state.blocks) {
      state.blocks = snapshotBlocks();
      render(state.data);
    }
  }

  function unavailableDashboard() {
    return {
      updatedAt: new Date().toISOString(),
      tools: [{
        tool: 'dashboard',
        label: copy('title'),
        confidence: 'error',
        error: copy('unavailableFallback')
      }]
    };
  }

  function getJSON(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = REQUEST_TIMEOUT_MS;
    var completed = false;
    function finish(data) {
      if (completed) return;
      completed = true;
      cb(data);
    }
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try { finish(JSON.parse(xhr.responseText)); return; } catch (_error) {}
      }
      finish(null);
    };
    xhr.onerror = xhr.ontimeout = function () { finish(null); };
    xhr.send();
  }

  document.documentElement.lang = lang;
  var i18nLoaded = false;
  var usageLoaded = false;
  var usage = null;

  function renderWhenReady() {
    if (!i18nLoaded || !usageLoaded) return;
    render(usage || unavailableDashboard());
    if (EDIT && usage && !editReady) { editReady = true; initEdit(); }
  }

  if (window.__INITIAL_I18N__ && window.__INITIAL_I18N__.dashboard) {
    var loc = window.__INITIAL_I18N__;
    i18n = {
      locale: (loc.meta && loc.meta.locale) || 'pt-BR',
      currency: (loc.meta && loc.meta.currency) || 'USD',
      copy: loc.dashboard
    };
    i18nLoaded = true;
  }
  if (window.__INITIAL_DATA__) {
    usage = window.__INITIAL_DATA__;
    usageLoaded = true;
  }

  if (i18nLoaded && usageLoaded) {
    renderWhenReady();
  } else {
    if (!i18nLoaded) {
      getJSON('/api/i18n?lang=' + encodeURIComponent(lang), function (data) {
        if (data && data.dashboard) {
          i18n = {
            locale: (data.meta && data.meta.locale) || 'en-US',
            currency: (data.meta && data.meta.currency) || 'USD',
            copy: data.dashboard
          };
        }
        i18nLoaded = true;
        renderWhenReady();
      });
    }
    if (!usageLoaded) {
      getJSON(API + '?_=' + Date.now(), function (data) {
        usage = data;
        usageLoaded = true;
        renderWhenReady();
      });
    }
  }
})();
</script>
</body>
</html>
