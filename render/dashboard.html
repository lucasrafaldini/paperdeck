<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard Render</title>
<!--__INJECT__-->
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var captureScale = Number(params.get('captureScale') || '');
    if (params.get('device') === 'kt3' || params.get('res') === '800x600') {
      document.documentElement.className = 'kt3';
    } else if (captureScale > 0 && captureScale <= 1) {
      document.documentElement.className = 'capture-landscape';
      document.documentElement.style.setProperty('--capture-scale', String(captureScale));
    } else if (params.get('desktop') === '1') {
      document.documentElement.className = 'desktop';
    }
    if (params.get('pip') === '1') {
      document.documentElement.classList.add('pip');
    }
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --capture-scale: 1; }
  html, body { width: 1072px; height: 1448px; background: #fff; color: #000; overflow: hidden; }
  body { font-family: Helvetica, Arial, sans-serif; -webkit-font-smoothing: none; }

  /* Kindle 8th Gen (KT3) 800x600 landscape */
  html.kt3, html.kt3 body { width: 800px; height: 600px; }
  html.kt3 .stage {
    position: relative; top: auto; left: auto;
    transform: none;
    width: 800px; height: 600px;
    padding: 16px 20px;
  }
  html.kt3 header {
    border-bottom: 4px solid #000; padding-bottom: 6px; margin-bottom: 12px;
  }
  html.kt3 h1 { font-size: 26px; font-weight: 800; }
  html.kt3 .stamp { font-size: 15px; font-weight: bold; }
  html.kt3 .cols { display: flex; gap: 14px; flex: 1; }
  html.kt3 .cols.custom-layout { display: flex; flex-wrap: wrap; gap: 14px; }
  html.kt3 .col-stacked { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
  html.kt3 .col-stacked .card { padding: 10px 14px; flex: 1; display: flex; flex-direction: column; }
  html.kt3 .col-stacked .card h2 { font-size: 19px; margin-bottom: 6px; padding-bottom: 3px; }
  html.kt3 .col-stacked .row { margin: 5px 0; }
  html.kt3 .col-stacked .row .label { font-size: 14px; margin-bottom: 2px; }
  html.kt3 .col-stacked .bar { height: 16px; }
  html.kt3 .col-stacked .reset { font-size: 12px; margin-top: 2px; }
  html.kt3 .col-stacked .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-top: auto;
    padding-top: 6px;
    border-top: 1px solid #888;
  }
  html.kt3 .col-stacked .stat-box { border: none; padding: 2px; text-align: center; }
  html.kt3 .col-stacked .stat-val { font-size: 15px; font-weight: bold; }
  html.kt3 .col-stacked .stat-lbl { font-size: 9px; opacity: 0.8; }
  html.kt3 .card { border: 3px solid #000; padding: 12px 14px; flex: 1; min-width: 0; display: flex; flex-direction: column; }
  html.kt3 .cols.custom-layout .card { flex: 1 1 calc(50% - 7px); min-width: 300px; }
  html.kt3 .cols.custom-layout .card.full-width { flex: 0 0 100%; min-width: 100%; }
  html.kt3 .card h2 { font-size: 20px; margin-bottom: 10px; border-bottom: 2px solid #000; padding-bottom: 4px; gap: 8px; }
  html.kt3 .card h2 .logo { width: 26px; height: 26px; flex: 0 0 26px; }
  html.kt3 .row { margin: 6px 0; }
  html.kt3 .row .label { font-size: 15px; margin-bottom: 3px; }
  html.kt3 .bar { height: 18px; border: 2px solid #000; }
  html.kt3 .reset { font-size: 13px; margin-top: 3px; }
  html.kt3 .sub { font-size: 14px; margin-top: 6px; line-height: 1.3; }
  html.kt3 .big { font-size: 22px; }
  html.kt3 .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  html.kt3 .stat-box { border: 2px solid #000; padding: 6px 8px; text-align: center; }
  html.kt3 .stat-val { font-size: 18px; font-weight: bold; }
  html.kt3 .stat-lbl { font-size: 11px; opacity: 0.8; font-weight: bold; text-transform: uppercase; margin-top: 2px; }
  html.kt3 .model-list { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  html.kt3 .model-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 3px 0; border-bottom: 1px dotted #666; }
  html.kt3 .model-name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
  html.kt3 .model-detail { font-size: 12px; white-space: nowrap; }

  .stage {
    position: absolute; top: 50%; left: 50%;
    width: 1448px; height: 1072px;
    transform: translate(-50%, -50%) rotate(90deg);
    transform-origin: center center;
    padding: 28px 36px; display: flex; flex-direction: column;
  }
  html.desktop, html.desktop body { width: 100%; height: 100%; }
  html.desktop .stage {
    position: relative; top: auto; left: auto;
    width: 100vw; height: 100vh;
    transform: none;
  }
  html.capture-landscape,
  html.capture-landscape body {
    width: calc(1448px * var(--capture-scale));
    height: calc(1072px * var(--capture-scale));
  }
  html.capture-landscape .stage {
    position: absolute; top: 0; left: 0;
    width: 1448px; height: 1072px;
    transform: scale(var(--capture-scale));
    transform-origin: top left;
  }
  /* PiP: janela flutuante no PC. Sem moldura, entao todo o corpo arrasta a janela. */
  html.pip body { -webkit-app-region: drag; cursor: move; }
  html.pip .stage { box-shadow: inset 0 0 0 4px #000; }
  /* Botao fechar: fora do conteudo (position fixed), invisivel ate o hover, para
     nao interferir na visualizacao. -webkit-app-region: no-drag = clicavel. */
  #pip-close { display: none; }
  html.pip #pip-close {
    display: flex; align-items: center; justify-content: center;
    position: fixed; top: 6px; right: 6px; z-index: 10;
    width: 26px; height: 26px; padding: 0;
    border: none; border-radius: 50%;
    background: rgba(0, 0, 0, 0.6); color: #fff;
    font: 18px/1 Helvetica, Arial, sans-serif; cursor: pointer;
    opacity: 0; transition: opacity 0.15s ease;
    -webkit-app-region: no-drag;
  }
  html.pip:hover #pip-close { opacity: 1; }
  html.pip #pip-close:hover { background: #000; }

  header {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 6px solid #000; padding-bottom: 16px; margin-bottom: 26px;
  }
  h1 { font-size: 52px; letter-spacing: -1px; }
  .stamp { font-size: 28px; text-align: right; }

  .cols { display: flex; gap: 28px; flex: 1; }
  .col-stacked { display: flex; flex-direction: column; gap: 20px; flex: 1; min-width: 0; }
  .col-stacked .card { flex: 1; }
  .card { flex: 1; border: 4px solid #000; padding: 24px 26px; display: flex; flex-direction: column; }
  .card h2 {
    display: flex; align-items: center; gap: 16px;
    font-size: 40px; margin-bottom: 22px; border-bottom: 3px solid #000; padding-bottom: 10px;
  }
  .card h2 .logo { width: 48px; height: 48px; flex: 0 0 48px; fill: #000; }

  .row { margin: 18px 0; }
  .row .label { display: flex; justify-content: space-between; font-size: 30px; font-weight: bold; margin-bottom: 8px; }
  .bar { height: 40px; border: 3px solid #000; }
  .bar > i { display: block; height: 100%; background: #000; }
  .reset { font-size: 34px; margin-top: 10px; }

  .notify-banner {
    background: #000; color: #fff; padding: 6px 12px; font-size: 15px; font-weight: bold;
    margin-bottom: 10px; border: 2px solid #000; text-align: center;
  }
  .sub { font-size: 28px; margin-top: 14px; line-height: 1.35; }
  .big { font-size: 46px; font-weight: bold; margin-top: auto; }
  .dim { opacity: 0.55; }
</style>
</head>
<body>
  <button id="pip-close" type="button" aria-label="Close" title="Close">&times;</button>
  <div class="stage">
    <header>
      <h1 id="title">Dashboard do Frater</h1>
      <div class="stamp" id="stamp">-</div>
    </header>
    <div id="notify-box" class="notify-banner" style="display:none"></div>
    <div class="cols" id="cols"></div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var lang = params.get('lang') || 'en';
  var API = '/api/usage';
  var readyId = params.get('ready');
  var REQUEST_TIMEOUT_MS = 15000;

  // Liga o botao fechar da janela PiP (so existe quando pip=1 + preload pip.js).
  if (params.get('pip') === '1') {
    var closeBtn = document.getElementById('pip-close');
    if (closeBtn) {
      closeBtn.addEventListener('click', function () {
        if (window.pipControls && window.pipControls.close) window.pipControls.close();
      });
    }
  }

  // Fallback minimo: garante que o PNG renderize mesmo se /api/i18n falhar.
  var FALLBACK = {
    locale: 'en-US',
    currency: 'USD',
    copy: {
      title: 'Kindle Dashboard',
      resetAt: 'Resets',
      unavailable: 'unavailable',
      tokenExpired: 'expired token - run `claude`',
      limitReached: 'limit reached - waiting',
      cooldown: 'waiting for interval',
      unavailableFallback: 'unavailable',
      extraUsage: 'Extra usage',
      currentBalance: 'Current balance',
      spent: 'Spent',
      monthlyLimit: 'Monthly limit',
      used: 'used',
      tokens: 'Tokens',
      sessions: 'sessions',
      goLimits: 'Go plan limits without API',
      claudeStale: 'Claude limits outdated',
      codexStale: 'local limits outdated (Codex used outside the CLI)'
    }
  };

  // Preenchido por /api/i18n (namespace dashboard + meta). Veja locales/.
  var i18n = FALLBACK;

  function copy(key) {
    if (i18n.copy && i18n.copy[key] != null) return i18n.copy[key];
    return FALLBACK.copy[key] != null ? FALLBACK.copy[key] : key;
  }

  var LOGOS = {
    claude: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#000" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="12" x2="12.00" y2="2.00"/><line x1="12" y1="12" x2="15.68" y2="6.28"/><line x1="12" y1="12" x2="20.37" y2="8.18"/><line x1="12" y1="12" x2="19.13" y2="13.02"/><line x1="12" y1="12" x2="19.41" y2="18.42"/><line x1="12" y1="12" x2="13.86" y2="18.33"/><line x1="12" y1="12" x2="9.32" y2="21.12"/><line x1="12" y1="12" x2="6.71" y2="16.58"/><line x1="12" y1="12" x2="2.70" y2="13.34"/><line x1="12" y1="12" x2="5.72" y2="9.13"/><line x1="12" y1="12" x2="7.19" y2="4.51"/></g></svg>',
    codex: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z"/></svg>',
    omnirouter: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#000" stroke-width="2.2"/><circle cx="12" cy="12" r="3.5" fill="#000"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke="#000" stroke-width="2.2"/></svg>',
    applemusic: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="#000"/></svg>',
    antigravity: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#000" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chaosmachine: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" stroke="#000" stroke-width="2.2" fill="none"/><line x1="8" y1="21" x2="16" y2="21" stroke="#000" stroke-width="2.2"/><line x1="12" y1="17" x2="12" y2="21" stroke="#000" stroke-width="2.2"/><circle cx="6" cy="14" r="1" fill="#000"/></svg>',
    macstats: '<svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" stroke="#000" stroke-width="2.2" fill="none"/><line x1="2" y1="20" x2="22" y2="20" stroke="#000" stroke-width="2.2"/><line x1="9" y1="16" x2="9" y2="20" stroke="#000" stroke-width="2"/><line x1="15" y1="16" x2="15" y2="20" stroke="#000" stroke-width="2"/></svg>'
  };

  function locale() {
    return i18n.locale || 'pt-BR';
  }

  function percent(value) {
    return (Math.round(value * 10) / 10).toLocaleString(locale(), {
      minimumFractionDigits: 0,
      maximumFractionDigits: 1
    }) + '%';
  }

  function money(cents, cur) {
    var amount = cents / 100;
    var currency = cur || i18n.currency || 'USD';
    try {
      return new Intl.NumberFormat(locale(), {
        style: 'currency',
        currency: currency
      }).format(amount);
    } catch (_error) {
      return currency + ' ' + amount.toFixed(2);
    }
  }

  function formatReset(value) {
    if (!value) return '';
    var d = new Date(value);
    if (isNaN(d.getTime())) return '';
    return copy('resetAt') + ': <strong>' +
      d.toLocaleDateString(locale(), { day: '2-digit', month: '2-digit', year: 'numeric' }) +
      ' ' +
      d.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' }) +
      '</strong>';
  }

  function bar(name, pct, resetsAt, showReset) {
    var p = Math.max(0, Math.min(100, pct));
    var reset = (showReset !== false && resetsAt) ? formatReset(resetsAt) : '';
    return '<div class="row"><div class="label"><span>' + name + '</span><span>' +
           percent(pct) + '</span></div>' +
           '<div class="bar"><i style="width:' + p + '%"></i></div>' +
           (reset ? '<div class="reset">' + reset + '</div>' : '') +
           '</div>';
  }

  function staleBar(name) {
    return '<div class="row"><div class="label"><span>' + name + '</span><span>' +
           copy('unavailable') + '</span></div>' +
           '<div class="sub dim">! ' + copy('codexStale') + '</div></div>';
  }

  function renderSvgPieChart(items) {
    if (!items || items.length === 0) return '';
    var size = 110;
    var r = 44;
    var cx = 55;
    var cy = 55;
    var total = items.reduce(function(acc, it) { return acc + (it.tokens || it.pct || 1); }, 0) || 1;
    var currentAngle = -Math.PI / 2;
    var paths = '';
    items.slice(0, 4).forEach(function(it, idx) {
      var val = it.tokens || it.pct || 1;
      var slice = (val / total) * 2 * Math.PI;
      var x1 = cx + r * Math.cos(currentAngle);
      var y1 = cy + r * Math.sin(currentAngle);
      var x2 = cx + r * Math.cos(currentAngle + slice);
      var y2 = cy + r * Math.sin(currentAngle + slice);
      var largeArc = slice > Math.PI ? 1 : 0;
      var fill = (idx === 0) ? '#000000' : (idx === 1) ? '#888888' : (idx === 2) ? '#cccccc' : '#ffffff';
      var d = 'M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2 + ' Z';
      paths += '<path d="' + d + '" fill="' + fill + '" stroke="#000" stroke-width="2"/>';
      currentAngle += slice;
    });
    var legend = items.slice(0, 4).map(function(it, idx) {
      var val = it.tokens || it.pct || 1;
      var pct = Math.round((val / total) * 100);
      var sym = (idx === 0) ? '■' : (idx === 1) ? '▨' : (idx === 2) ? '▧' : '□';
      return '<div style="font-size:11px;white-space:nowrap">' + sym + ' ' + it.name.substring(0, 14) + ': ' + pct + '%</div>';
    }).join('');
    return '<div style="display:flex;align-items:center;gap:12px;margin:8px 0">' +
           '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' + paths + '</svg>' +
           '<div style="display:flex;flex-direction:column;gap:3px">' + legend + '</div>' +
           '</div>';
  }

  function renderSvgHistoryChart(title, dataPoints) {
    var points = dataPoints || [35, 48, 62, 55, 80, 45, 68];
    var w = 240;
    var h = 32;
    var maxVal = Math.max.apply(null, points) || 1;
    var barW = 22;
    var gap = 10;
    var bars = points.map(function(val, idx) {
      var barH = Math.max(4, Math.round((val / maxVal) * (h - 8)));
      var x = idx * (barW + gap);
      var y = h - barH;
      return '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barH + '" fill="#000" stroke="#000" stroke-width="1"/>' +
             '<text x="' + (x + barW / 2) + '" y="' + (h + 10) + '" font-size="8" text-anchor="middle" font-weight="bold">' + ['D-6','D-5','D-4','D-3','D-2','D-1','Hoje'][idx] + '</text>';
    }).join('');
    return '<div style="margin:6px 0 10px">' +
           '<div style="font-size:11px;font-weight:bold;margin-bottom:3px">' + (title || 'Histórico 7 dias') + ':</div>' +
           '<svg width="' + w + '" height="' + (h + 14) + '" viewBox="0 0 ' + w + ' ' + (h + 14) + '">' + bars + '</svg>' +
           '</div>';
  }

  function card(t, blockCfg) {
    var logo = LOGOS[t.tool] || '';
    var opt = (window.__CURRENT_OPTIONS__ && window.__CURRENT_OPTIONS__[t.tool]) || {};
    var extraClass = (blockCfg && blockCfg.width === 'full') ? ' full-width' : '';
    var h = '<div class="card' + extraClass + '"><h2>' + logo + '<span>' + t.label + '</span></h2>';

    if (t.confidence === 'error' || t.confidence === 'cooldown') {
      var e = t.error || '';
      var msg = /401/.test(e) ? copy('tokenExpired')
              : /429/.test(e) ? copy('limitReached')
              : t.confidence === 'cooldown' ? copy('cooldown')
              : (e || copy('unavailableFallback'));
      return h + '<div class="sub" style="margin-top:24px">! ' + copy('unavailable') + '</div>' +
             '<div class="sub dim">' + msg + '</div></div>';
    }

    if (t.tool === 'macstats') {
      if (opt.sysInfo !== false) {
        h += '<div class="sub" style="font-size:13px;font-weight:bold;margin:2px 0 6px">' + (t.model || 'Mac') + ' · ' + (t.osRelease || 'macOS') + ' (' + (t.cores || '') + ' cores)</div>';
      }
      if (opt.cpuBar !== false) {
        h += bar('CPU', t.cpuPct || 0);
      }
      if (opt.ramBar !== false) {
        h += bar('RAM (' + (t.memUsedGb || 0) + ' / ' + (t.memTotalGb || 0) + ' GB)', t.memPct || 0);
      }
      if (opt.diskBar !== false) {
        h += bar('Disco (' + (t.diskUsedGb || 0) + ' / ' + (t.diskTotalGb || 0) + ' GB)', t.diskPct || 0);
      }
      if (opt.uptime !== false && t.uptime) {
        h += '<div class="sub" style="font-size:12px;opacity:0.8;margin-top:4px">Uptime: ' + t.uptime + '</div>';
      }
      return h + '</div>';
    }

    if (t.tool === 'omnirouter') {
      var formatNum = function(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
        return String(n);
      };
      var totalTok = formatNum(t.totalTokens || 0);
      var costStr = '$' + Number(t.totalCost || 0).toFixed(2);
      var reqs = (t.totalRequests || 0).toLocaleString(locale());
      var providers = (t.activeProviders || 0) + ' ativos';

      if (opt.statGrid !== false) {
        h += '<div class="stat-grid">' +
             '<div class="stat-box"><div class="stat-val">' + totalTok + '</div><div class="stat-lbl">Tokens Totais</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + costStr + '</div><div class="stat-lbl">Custo Total</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + reqs + '</div><div class="stat-lbl">Requisições</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + providers + '</div><div class="stat-lbl">Provedores</div></div>' +
             '</div>';
      }

      if (opt.pieChart && t.topModels && t.topModels.length > 0) {
        h += renderSvgPieChart(t.topModels);
      }

      if (opt.historyChart) {
        h += renderSvgHistoryChart('Histórico Tokens Omni Router', [220, 260, 310, 290, 410, 380, 520]);
      }

      if (opt.topModels !== false && t.topModels && t.topModels.length > 0) {
        h += '<div class="sub" style="font-weight:bold;margin-top:6px;margin-bottom:2px">Modelos mais usados:</div>';
        h += '<div class="model-list">';
        t.topModels.slice(0, 4).forEach(function(m) {
          h += '<div class="model-row">' +
               '<span class="model-name">' + m.name + '</span>' +
               '<span class="model-detail">' + formatNum(m.tokens || 0) + ' tok · ' + m.requests + ' req</span>' +
               '</div>';
        });
        h += '</div>';
      }
      return h + '</div>';
    }

    if (t.tool === 'applemusic') {
      var stateIcon = t.state === 'tocando' ? '▶ ' : '⏸ ';
      if (opt.nowPlaying !== false) {
        h += '<div class="sub" style="font-size:18px;font-weight:bold;margin-top:8px">' + stateIcon + (t.track || 'Sem reprodução') + '</div>';
      }
      if (t.artist) {
        h += '<div class="sub" style="font-size:15px;opacity:0.8;margin-top:2px">' + t.artist + (opt.album !== false && t.album ? ' · ' + t.album : '') + '</div>';
      }
      if (opt.progressBar !== false && t.durStr) {
        h += '<div class="row" style="margin-top:12px"><div class="label" style="font-size:13px"><span>' + (t.posStr || '0:00') + '</span><span>' + t.durStr + '</span></div>' +
             '<div class="bar" style="height:14px"><i style="width:' + (t.pct || 0) + '%"></i></div></div>';
      }
      return h + '</div>';
    }

    if (t.tool === 'antigravity') {
      (t.windows || []).forEach(function (w) {
        if (w.name.indexOf('5h') !== -1 && opt.bar5h === false) return;
        if (w.name.indexOf('7d') !== -1 && opt.bar7d === false) return;
        h += bar(w.name, w.pct, w.resets_at, opt.resets !== false);
      });

      if (opt.historyChart) {
        h += renderSvgHistoryChart('Passos Brain (7 dias)', [450, 720, 1100, 950, 1400, 1820, 2001]);
      }

      if (opt.statsGrid !== false) {
        var stepsStr = t.activeSessionSteps ? t.activeSessionSteps.toLocaleString(locale()) : '-';
        var statusBadge = t.status === 'Ativo' ? '● Ativo' : '○ Ocioso';
        h += '<div class="stat-grid" style="margin:4px 0 2px">' +
             '<div class="stat-box"><div class="stat-val">' + (t.totalConversations || 0) + '</div><div class="stat-lbl">Conversas</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + (t.totalBrainProjects || 0) + '</div><div class="stat-lbl">Projetos</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + stepsStr + '</div><div class="stat-lbl">Passos Sessão</div></div>' +
             '<div class="stat-box"><div class="stat-val">' + statusBadge + '</div><div class="stat-lbl">Status</div></div>' +
             '</div>';
      }
      return h + '</div>';
    }

    if (t.tool === 'claude') {
      (t.windows || []).forEach(function (w) {
        if (w.name.indexOf('5h') !== -1 && opt.bar5h === false) return;
        if (w.name.indexOf('7d') !== -1 && opt.bar7d === false) return;
        h += bar(w.name, w.pct, w.resets_at, opt.resets !== false);
      });
      (t.stale_windows || []).forEach(function (w) { h += staleBar(w.name); });
      if (opt.history7d) {
        h += renderSvgHistoryChart('Uso Claude (7 dias)', [40, 55, 70, 65, 85, 60, 68]);
      }
      if (t.noteKey) h += '<div class="sub dim">! ' + copy(t.noteKey) + '</div>';
      return h + '</div>';
    }

    if (t.tool === 'chaosmachine') {
      var statusBadge = t.state === 'online' ? '● Online' : '○ Offline';
      h += '<div class="sub" style="font-weight:bold;margin-top:6px">' + statusBadge + ' · ' + (t.host || 'linux') + '</div>';
      if (t.state === 'online') {
        h += '<div class="stat-grid">' +
             (opt.loadAvg !== false ? '<div class="stat-box"><div class="stat-val">' + (t.loadAvg || '-') + '</div><div class="stat-lbl">Load Average</div></div>' : '') +
             (opt.ram !== false ? '<div class="stat-box"><div class="stat-val">' + (t.memPct || 0) + '%</div><div class="stat-lbl">RAM (' + t.memUsed + 'MB)</div></div>' : '') +
             '</div>';
        if (opt.uptime !== false && t.uptime) h += '<div class="sub" style="font-size:13px;opacity:0.75">Uptime: ' + t.uptime + '</div>';
      } else {
        h += '<div class="sub dim" style="margin-top:16px">! Servidor offline ou inacessível via SSH</div>';
      }
      return h + '</div>';
    }

    if (t.tool === 'macstats') {
      if (opt.cpuBar !== false) {
        h += '<div class="row"><div class="label"><span>CPU</span><span>' + (t.cpuPct || 0) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.cpuPct || 0) + '%"></i></div></div>';
      }
      if (opt.ramBar !== false) {
        h += '<div class="row"><div class="label"><span>RAM (' + (t.memUsedGb || 0) + ' / ' + (t.memTotalGb || 0) + ' GB)</span><span>' + (t.memPct || 0) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.memPct || 0) + '%"></i></div></div>';
      }
      if (opt.diskBar !== false && t.diskTotalGb) {
        h += '<div class="row"><div class="label"><span>Disco / (' + (t.diskUsedGb || 0) + ' / ' + (t.diskTotalGb || 0) + ' GB)</span><span>' + (t.diskPct || 0) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.diskPct || 0) + '%"></i></div></div>';
      }
      if (opt.sysInfo !== false || opt.uptime !== false) {
        h += '<div class="stat-grid" style="margin-top:6px">' +
             (opt.uptime !== false ? '<div class="stat-box"><div class="stat-val">' + (t.uptime || '-') + '</div><div class="stat-lbl">Uptime</div></div>' : '') +
             (opt.sysInfo !== false ? '<div class="stat-box"><div class="stat-val" style="font-size:12px">' + (t.model || 'Mac') + '</div><div class="stat-lbl">' + (t.osRelease || 'macOS') + '</div></div>' : '') +
             '</div>';
      }
      return h + '</div>';
    }

    if (t.tool === 'tamagotchi') {
      var moodIcon = t.mood === 'happy' ? '✨' : (t.mood === 'hungry' ? '🍲' : (t.mood === 'sleeping' ? '💤' : (t.mood === 'dirty' ? '🧼' : '🐾')));
      h += '<div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px">' +
           '<div><span style="font-size:17px;font-weight:bold">' + (t.name || 'Mametchi') + '</span> ' +
           '<span style="font-size:12px;opacity:0.75">Nível ' + (t.level || 1) + ' · ' + (t.ageDays || 1) + 'd</span></div>' +
           '<div style="font-size:13px;font-style:italic">' + moodIcon + ' ' + (t.statusText || '') + '</div>' +
           '</div>';

      h += '<div style="display:flex;align-items:center;gap:12px;margin:8px 0 6px">' +
           '<div style="background:#fff;border:2px solid #000;border-radius:6px;padding:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
           (t.svgMono || ('<div style="font-family:monospace;font-size:14px;padding:8px">' + (t.spriteAscii || '(=^･ω･^=)') + '</div>')) +
           '</div>' +
           '<div style="flex:1">';

      if (opt.showBars !== false) {
        h += '<div class="row"><div class="label"><span>Fome</span><span>' + (t.hunger || 0) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.hunger || 0) + '%"></i></div></div>';
        h += '<div class="row"><div class="label"><span>Felicidade</span><span>' + (t.happiness || 0) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.happiness || 0) + '%"></i></div></div>';
        h += '<div class="row"><div class="label"><span>Energia</span><span>' + (t.energy || 0) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.energy || 0) + '%"></i></div></div>';
        h += '<div class="row"><div class="label"><span>Limpeza</span><span>' + (t.cleanliness != null ? t.cleanliness : 100) + '%</span></div>' +
             '<div class="bar"><i style="width:' + (t.cleanliness != null ? t.cleanliness : 100) + '%"></i></div></div>';
      }
      h += '</div></div>';

      // Frase motivacional diária do mascote para a tela do Kindle
      var quote = t.dailyQuote || 'Codando igual um condenado? Beba água, senão mordo seu pé! ☕🐾';
      h += '<div style="margin-top:8px;padding:6px 10px;border:1.5px solid #000;border-radius:6px;background:#f8f8f8;display:flex;align-items:flex-start;gap:8px">' +
           '<span style="font-size:16px;line-height:1">💬</span>' +
           '<div style="flex:1">' +
           '<div style="font-size:10px;text-transform:uppercase;font-weight:bold;letter-spacing:0.5px;opacity:0.75;margin-bottom:2px">' + (t.name || 'Mascote') + ' diz:</div>' +
           '<div style="font-size:13px;font-style:italic;font-weight:600;line-height:1.3;color:#000">"' + quote + '"</div>' +
           '</div></div>';

      return h + '</div>';
    }

    if (t.tool === 'sitescraper') {
      var sites = t.sites || [];
      if (sites.length === 0) {
        h += '<div class="sub dim" style="margin-top:10px">Nenhum site configurado ou aguardando sincronização.</div>';
      } else {
        sites.forEach(function(s, idx) {
          if (idx > 0) h += '<div style="border-top:1px dashed #ccc;margin:8px 0"></div>';
          h += '<div style="display:flex;align-items:center;justify-content:space-between;margin:4px 0 2px">' +
               '<strong style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px">🌐 ' + (s.name || s.url) + '</strong>' +
               '<span style="font-size:11px;opacity:0.7">' + (s.updatedAt || '') + '</span>' +
               '</div>';
          var posts = s.posts || [];
          if (posts.length === 0) {
            h += '<div class="sub dim" style="font-size:12px">Sem novos posts</div>';
          } else {
            var limit = opt.maxItems || 3;
            posts.slice(0, limit).forEach(function(p) {
              h += '<div style="margin:3px 0;display:flex;align-items:baseline;justify-content:space-between;gap:6px">' +
                   '<span style="font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">• ' + p.title + '</span>' +
                   (opt.showDate !== false && p.date ? '<span style="font-size:11px;opacity:0.65;flex-shrink:0">' + p.date + '</span>' : '') +
                   '</div>';
            });
          }
        });
      }
      return h + '</div>';
    }

    (t.windows || []).forEach(function (w) { h += bar(w.name, w.pct, w.resets_at); });
    (t.stale_windows || []).forEach(function (w) { h += staleBar(w.name); });
    if (t.noteKey) h += '<div class="sub dim">! ' + copy(t.noteKey) + '</div>';
    if (t.extra) {
      h += '<div class="sub">' + copy('extraUsage') + '</div>';
      if (typeof t.extra.current_balance === 'number') {
        h += '<div class="sub">' + copy('currentBalance') + ': ' + money(t.extra.current_balance, t.extra.currency) + '</div>';
      }
      h += '<div class="sub">' + copy('spent') + ': ' + money(t.extra.used_credits, t.extra.currency) +
           ' · ' + copy('monthlyLimit') + ': ' + money(t.extra.monthly_limit, t.extra.currency) +
           '<br>(' + percent(t.extra.pct) + ' ' + copy('used') + ')</div>';
    }
    if (t.tokens) {
      h += '<div class="sub">' + copy('tokens') + ': ' + t.tokens.total.toLocaleString(locale()) + '</div>';
    }
    if (t.spend) {
      h += '<div class="big">' + money(Math.round(t.spend.usd * 100), 'USD') + '</div>' +
           '<div class="sub dim">' + t.spend.sessions + ' ' + copy('sessions') + ' · ' + copy('goLimits') + '</div>';
    }
    return h + '</div>';
  }

  function render(data) {
    window.__CURRENT_OPTIONS__ = data.widgetOptions || {};
    var notifyEl = document.getElementById('notify-box');
    if (data.notification) {
      notifyEl.textContent = '📢 ' + data.notification;
      notifyEl.style.display = 'block';
    } else {
      notifyEl.style.display = 'none';
    }

    var tools = data.tools || [];
    var html = '';

    // Modo customizado ou preset?
    if (data.layout && data.layout.mode === 'custom' && Array.isArray(data.layout.blocks) && data.layout.blocks.length > 0) {
      var toolsMap = {};
      tools.forEach(function(t) { toolsMap[t.tool] = t; });
      html = data.layout.blocks.map(function(block) {
        var t = toolsMap[block.tool];
        if (!t) return '';
        return card(t, block);
      }).join('');
    } else {
      var claudeIdx = -1;
      var antigravityIdx = -1;
      for (var i = 0; i < tools.length; i++) {
        if (tools[i].tool === 'claude') claudeIdx = i;
        if (tools[i].tool === 'antigravity') antigravityIdx = i;
      }

      if (claudeIdx !== -1 && antigravityIdx !== -1) {
        var claudeTool = tools[claudeIdx];
        var antigravityTool = tools[antigravityIdx];
        var others = tools.filter(function(t, idx) { return idx !== claudeIdx && idx !== antigravityIdx; });
        html += '<div class="col-stacked">' + card(claudeTool) + card(antigravityTool) + '</div>';
        others.forEach(function(t) { html += card(t); });
      } else {
        html = tools.map(function(t) { return card(t); }).join('');
      }
    }

    document.getElementById('cols').innerHTML = html;
    var d = new Date(data.updatedAt || Date.now());
    var timeStr = d.toLocaleDateString(locale()) + '  ' + d.toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' });
    if (data.kindleStatus && data.kindleStatus.battery != null) {
      var icon = data.kindleStatus.isCharging ? '⚡' : '🔋';
      timeStr += '  ' + icon + ' ' + data.kindleStatus.battery + '%';
    } else {
      timeStr += '  🔋 --%';
    }
    document.getElementById('stamp').textContent = timeStr;
    document.title = readyId ? 'READY:' + readyId : 'READY';
  }

  function unavailableDashboard() {
    return {
      updatedAt: new Date().toISOString(),
      tools: [{
        tool: 'dashboard',
        label: copy('title'),
        confidence: 'error',
        error: copy('unavailableFallback')
      }]
    };
  }

  function getJSON(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = REQUEST_TIMEOUT_MS;
    var completed = false;
    function finish(data) {
      if (completed) return;
      completed = true;
      cb(data);
    }
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try { finish(JSON.parse(xhr.responseText)); return; } catch (_error) {}
      }
      finish(null);
    };
    xhr.onerror = xhr.ontimeout = function () { finish(null); };
    xhr.send();
  }

  document.documentElement.lang = lang;
  var i18nLoaded = false;
  var usageLoaded = false;
  var usage = null;

  function renderWhenReady() {
    if (!i18nLoaded || !usageLoaded) return;
    var customTitle = (usage && usage.dashboardTitle) || copy('title') || 'Kindle Dashboard';
    document.getElementById('title').textContent = customTitle;
    render(usage || unavailableDashboard());
  }

  if (window.__INITIAL_I18N__ && window.__INITIAL_I18N__.dashboard) {
    var loc = window.__INITIAL_I18N__;
    i18n = {
      locale: (loc.meta && loc.meta.locale) || 'pt-BR',
      currency: (loc.meta && loc.meta.currency) || 'USD',
      copy: loc.dashboard
    };
    i18nLoaded = true;
  }
  if (window.__INITIAL_DATA__) {
    usage = window.__INITIAL_DATA__;
    usageLoaded = true;
  }

  if (i18nLoaded && usageLoaded) {
    renderWhenReady();
  } else {
    if (!i18nLoaded) {
      getJSON('/api/i18n?lang=' + encodeURIComponent(lang), function (data) {
        if (data && data.dashboard) {
          i18n = {
            locale: (data.meta && data.meta.locale) || 'en-US',
            currency: (data.meta && data.meta.currency) || 'USD',
            copy: data.dashboard
          };
        }
        i18nLoaded = true;
        renderWhenReady();
      });
    }
    if (!usageLoaded) {
      getJSON(API + '?_=' + Date.now(), function (data) {
        usage = data;
        usageLoaded = true;
        renderWhenReady();
      });
    }
  }
})();
</script>
</body>
</html>
